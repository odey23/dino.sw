<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New Instance | Dino Wallet</title>
  <style>
    :root {
      color: #18324a;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top right, rgba(255, 216, 77, 0.9), transparent 32%),
        radial-gradient(circle at bottom left, rgba(70, 183, 120, 0.8), transparent 36%),
        #f6f1dd;
    }

    .register-card {
      width: min(100%, 470px);
      padding: 40px;
      border: 1px solid rgba(24, 50, 74, 0.12);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 24px 60px rgba(24, 50, 74, 0.2);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #4a865a;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(2rem, 7vw, 2.7rem); }

    .intro { margin: 12px 0 28px; color: #5c6875; line-height: 1.6; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-size: 0.93rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #c8d1d8;
      border-radius: 12px;
      color: #18324a;
      font: inherit;
    }

    input:focus {
      outline: 3px solid rgba(76, 175, 80, 0.22);
      border-color: #4a865a;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #2f7850;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover:not(:disabled) { background: #215b3a; transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: 0.7; }

    #message { min-height: 1.5em; margin: 16px 0 0; font-weight: 600; }
    #message.error { color: #b3261e; }
    #message.success { color: #1e6e3b; }

    .login-link { margin: 24px 0 0; text-align: center; color: #5c6875; }
    .login-link a { color: #1e6e3b; font-weight: 700; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }

    @media (max-width: 520px) {
      body { padding: 16px; }
      .register-card { padding: 30px 24px; }
    }
  </style>
</head>
<body>
  <main class="register-card">
    <p class="eyebrow">Dino Wallet</p>
    <h1>Create new instance</h1>
    <p class="intro">Create a new account to access your Dino Wallet dashboard.</p>

    <form id="registerForm" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="30" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>

      <button id="registerButton" type="submit">Create account</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="login-link">Already have an account? <a href="login.html">Log in</a></p>
  </main>
  <script src="register.js"></script>
</body>
</html>
